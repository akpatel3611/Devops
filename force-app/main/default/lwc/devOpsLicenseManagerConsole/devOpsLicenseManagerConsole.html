<template>
    <div class="license-console-container slds-p-around_medium">
        
        <!-- Header Banner -->
        <div class="console-header-card slds-p-around_medium slds-m-bottom_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <span class="header-icon-badge">
                        <lightning-icon icon-name="utility:user" size="medium" variant="inverse"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h1 class="console-main-title">DevOps License & User Access Management Console</h1>
                    <p class="console-sub-title">Manage allocated DevOps licenses, user permissions, and license assignment toggles in real time.</p>
                </div>
            </div>
            <div class="header-right-actions">
                <button class="slds-button slds-button_neutral refresh-btn" onclick={handleRefreshAll}>
                    <lightning-icon icon-name="utility:refresh" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    Refresh Overview
                </button>
            </div>
        </div>

        <!-- License Allocation Gauge Cards -->
        <div class="slds-grid slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card card-blue">
                    <div class="metric-label">TOTAL ALLOCATED LICENSES</div>
                    <div class="metric-value">{overview.totalAllocatedLicenses}</div>
                    <div class="metric-sub">Org Max Allocation</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card card-orange">
                    <div class="metric-label">USED LICENSES</div>
                    <div class="metric-value">{overview.usedLicensesCount}</div>
                    <div class="metric-sub">Active Users Licensed</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card card-green">
                    <div class="metric-label">AVAILABLE LICENSES</div>
                    <div class="metric-value">{overview.availableLicensesCount}</div>
                    <div class="metric-sub">Ready for Assignment</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-4">
                <div class="metric-card card-slate">
                    <div class="metric-label">ACTIVE ORG USERS</div>
                    <div class="metric-value">{overview.activeUsersCount}</div>
                    <div class="metric-sub">Total Active Users</div>
                </div>
            </div>
        </div>

        <!-- User Search & Filter Toolbar -->
        <div class="table-card slds-p-around_medium">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
                <div class="table-title">
                    <h2 class="font-bold text-lg">Salesforce User License Assignment Table</h2>
                    <p class="text-sm text-muted">Toggle the license switch to assign or revoke DevOps user permissions.</p>
                </div>
                <div class="search-input-box">
                    <lightning-input
                        name="searchUser"
                        type="search"
                        value={searchKey}
                        placeholder="Search User by Name, Email, or Profile..."
                        variant="label-hidden"
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading User Licenses..." size="medium" variant="brand"></lightning-spinner>
                    <p class="slds-m-top_small text-muted">Fetching Salesforce user license details...</p>
                </div>
            </template>

            <!-- User Datatable -->
            <template if:false={isLoading}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered custom-user-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">USER NAME</div></th>
                                <th scope="col"><div class="slds-truncate">EMAIL</div></th>
                                <th scope="col"><div class="slds-truncate">PROFILE</div></th>
                                <th scope="col"><div class="slds-truncate">ROLE</div></th>
                                <th scope="col"><div class="slds-truncate">LICENSE TIER</div></th>
                                <th scope="col"><div class="slds-truncate">DEVOPS LICENSE STATUS</div></th>
                                <th scope="col"><div class="slds-truncate">ASSIGN / REVOKE TOGGLE</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={userList} for:item="u">
                                <tr key={u.userId} class="slds-hint-parent">
                                    <td>
                                        <div class="slds-truncate font-semibold user-name-link">{u.name}</div>
                                    </td>
                                    <td><div class="slds-truncate">{u.email}</div></td>
                                    <td><div class="slds-truncate">{u.profileName}</div></td>
                                    <td><div class="slds-truncate">{u.roleName}</div></td>
                                    <td>
                                        <span class="tier-pill">{u.licenseTier}</span>
                                    </td>
                                    <td>
                                        <template if:true={u.isLicensed}>
                                            <span class="status-badge status-active">ACTIVE LICENSE</span>
                                        </template>
                                        <template if:false={u.isLicensed}>
                                            <span class="status-badge status-inactive">UNLICENSED</span>
                                        </template>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="toggle"
                                            label=""
                                            checked={u.isLicensed}
                                            data-id={u.userId}
                                            data-name={u.name}
                                            message-toggle-active="Licensed"
                                            message-toggle-inactive="Revoked"
                                            onchange={handleToggleUserLicense}>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </div>
</template>
