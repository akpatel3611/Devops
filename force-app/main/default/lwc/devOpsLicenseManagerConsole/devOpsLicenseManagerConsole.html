<template>
    <div class="license-console-container slds-p-around_medium">
        
        <!-- Copado-Style Header Banner -->
        <div class="console-header-card slds-p-around_medium slds-m-bottom_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <span class="header-icon-badge">
                        <lightning-icon icon-name="utility:user" size="medium" variant="inverse"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h1 class="console-main-title">DevOps License & Entitlement Manager</h1>
                    <p class="console-sub-title">Centralized admin portal to allocate, audit, and sync multi-tier DevOps feature seat entitlements across org users.</p>
                </div>
            </div>
            <div class="header-right-actions">
                <button class="slds-button slds-button_neutral refresh-btn" onclick={handleRefreshAll}>
                    <lightning-icon icon-name="utility:refresh" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    Refresh Entitlements
                </button>
            </div>
        </div>

        <!-- Copado-Style Capacity Progress Bar Gauges -->
        <div class="slds-grid slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-4">
                <div class="gauge-card">
                    <div class="gauge-header">
                        <span class="gauge-label">DevOps Admin</span>
                        <span class="gauge-count">{overview.usedAdminLicenses} / {overview.totalAdminLicenses}</span>
                    </div>
                    <div class="gauge-track">
                        <div class="gauge-fill fill-admin" style={adminProgressStyle}></div>
                    </div>
                    <div class="gauge-sub">Full Pipeline & Inspector Access</div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-4">
                <div class="gauge-card">
                    <div class="gauge-header">
                        <span class="gauge-label">DevOps Developer</span>
                        <span class="gauge-count">{overview.usedDeveloperLicenses} / {overview.totalDeveloperLicenses}</span>
                    </div>
                    <div class="gauge-track">
                        <div class="gauge-fill fill-dev" style={devProgressStyle}></div>
                    </div>
                    <div class="gauge-sub">Metadata Commit & Test Execution</div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-4">
                <div class="gauge-card">
                    <div class="gauge-header">
                        <span class="gauge-label">Release Manager</span>
                        <span class="gauge-count">{overview.usedReleaseManagerLicenses} / {overview.totalReleaseManagerLicenses}</span>
                    </div>
                    <div class="gauge-track">
                        <div class="gauge-fill fill-rm" style={rmProgressStyle}></div>
                    </div>
                    <div class="gauge-sub">Stage Promotions & Quality Gates</div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-4">
                <div class="gauge-card">
                    <div class="gauge-header">
                        <span class="gauge-label">Active Org Users</span>
                        <span class="gauge-count">{overview.activeOrgUsersCount}</span>
                    </div>
                    <div class="gauge-track">
                        <div class="gauge-fill fill-org" style="width: 100%;"></div>
                    </div>
                    <div class="gauge-sub">Total Active Salesforce Users</div>
                </div>
            </div>
        </div>

        <!-- Copado-Style Users With Licenses Table -->
        <div class="table-card slds-p-around_medium">
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
                <div class="table-title">
                    <h2 class="font-bold text-lg">Users with Feature Entitlements</h2>
                    <p class="text-sm text-muted">Check or uncheck feature checkboxes to grant or revoke specific DevOps role entitlements.</p>
                </div>
                <div class="search-input-box">
                    <lightning-input
                        name="searchUser"
                        type="search"
                        value={searchKey}
                        placeholder="Search User by Name, Email, or Profile..."
                        variant="label-hidden"
                        onchange={handleSearchChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading Entitlements..." size="medium" variant="brand"></lightning-spinner>
                    <p class="slds-m-top_small text-muted">Calculating real-time license allocations...</p>
                </div>
            </template>

            <!-- User License Datatable -->
            <template if:false={isLoading}>
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered custom-user-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate">FULL NAME</div></th>
                                <th scope="col"><div class="slds-truncate">EMAIL</div></th>
                                <th scope="col"><div class="slds-truncate">PROFILE</div></th>
                                <th scope="col"><div class="slds-truncate">LAST LOGIN</div></th>
                                <th scope="col" class="slds-text-align_center"><div class="slds-truncate">DEVOPS ADMIN</div></th>
                                <th scope="col" class="slds-text-align_center"><div class="slds-truncate">DEVOPS DEVELOPER</div></th>
                                <th scope="col" class="slds-text-align_center"><div class="slds-truncate">RELEASE MANAGER</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={userList} for:item="u">
                                <tr key={u.userId} class="slds-hint-parent">
                                    <td>
                                        <div class="slds-truncate font-semibold user-name-link">{u.userName}</div>
                                    </td>
                                    <td><div class="slds-truncate">{u.email}</div></td>
                                    <td><div class="slds-truncate">{u.profileName}</div></td>
                                    <td><div class="slds-truncate">{u.lastLoginDate}</div></td>
                                    <td class="slds-text-align_center">
                                        <lightning-input
                                            type="checkbox"
                                            checked={u.isDevOpsAdmin}
                                            data-id={u.userId}
                                            data-type="Admin"
                                            onchange={handleCheckboxToggle}>
                                        </lightning-input>
                                    </td>
                                    <td class="slds-text-align_center">
                                        <lightning-input
                                            type="checkbox"
                                            checked={u.isDevOpsDeveloper}
                                            data-id={u.userId}
                                            data-type="Developer"
                                            onchange={handleCheckboxToggle}>
                                        </lightning-input>
                                    </td>
                                    <td class="slds-text-align_center">
                                        <lightning-input
                                            type="checkbox"
                                            checked={u.isReleaseManager}
                                            data-id={u.userId}
                                            data-type="ReleaseManager"
                                            onchange={handleCheckboxToggle}>
                                        </lightning-input>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </div>
</template>
